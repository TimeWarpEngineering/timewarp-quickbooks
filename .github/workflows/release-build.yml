name: Build and Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'source/**'
      - 'tests/**'
      - '.github/workflows/release-build.yml'
      - 'Directory.Build.props'
      - '*.props'
      - '*.targets'
  release:
    types: [created]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
    defaults:
      run:
        shell: pwsh
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Pack
        run: |
          cd source/timewarp-quickbooks/
          dotnet build --configuration Release
          dotnet pack --configuration Release --output ./bin/Packages

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Publish TimeWarp.QuickBooks
        run: |
          cd source/timewarp-quickbooks/bin/Packages
          dotnet nuget push TimeWarp.QuickBooks.*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - run: echo "🍏 This job's status is ${{ job.status }}."
