# MemSearch repo knowledge index — TimeWarp convention
#
# SPEC (proposed extension)
# -------------------------
# memsearch's stock CLI ignores [index]; this file is honored by:
#   ganda memsearch index-repo
#
# Indexing is MANUAL (task 339). The repo-baseline git hooks no longer index:
# every commit, merge, and checkout re-embedded the repo's markdown on all cores,
# queued machine-wide on one lock, and built a collection per task worktree
# (577 collections, 18 GB), while nothing automated ever searched them.
# Run `ganda memsearch index-repo` when you want a fresh index.
#
# Purpose: index markdown knowledge in THIS repo only. One Milvus collection
# per repo, named for the origin repo and hashed on the origin-home path, so a
# run from any worktree updates the same collection. Global DB file stays at
# ~/.memsearch/milvus.db unless [milvus].uri is overridden below.
# Reclaim leftover per-worktree collections: ganda memsearch prune-collections.
#
# [index].paths
#   Directory roots (relative to repo root). memsearch indexes all .md files
#   under each path recursively. Missing paths are skipped.
#
# [index].exclude_paths
#   Directory paths removed from the resolved path list before indexing.
#   Does not prune subdirectories when a parent path (e.g. "kanban/") is listed.
#
# [index].exclude_globs
#   Reserved — file-level globs (e.g. "**/task-template.md"). Not implemented in v1.
#
# [index].enabled
#   false makes `ganda memsearch index-repo` skip (conversation plugins still work).
#
# [milvus].collection
#   Empty = auto-derive ms_<origin-repo-name>_<8char sha256 of origin-home path>.
#
# Search this repo only:
#   memsearch search "query" -c <collection> --source-prefix "$(pwd)/kanban/"

[index]
enabled = true
paths = [
  "kanban",
  "documentation",
  "okf",
  "adr",
  ".memsearch/memory",
]
exclude_paths = []
exclude_globs = [
  "**/task-template.md",
  "**/overview.md",
]

[milvus]
# uri = ".memsearch/milvus.db"   # optional per-repo DB file
collection = ""